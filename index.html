<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savings Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="site">
    <header class="top">
       <div class="logo-group">
            <img src="assets/logo.svg" alt="Savings Tracker logo">
            <h1 class="title">Savings Tracker</h1>
        </div>
        <button class="add-goal-btn"><span class="plus">+</span> New Goal</button>
    </header>

    <hr class="line">

    <section class="total-statistics">
        <div class="savings-plate">
            <h3 class="plate-text">Total Savings</h3>
            <p class="plate1-num">$11 200</p>
        </div>
        <div class="active-goals">
            <h3 class="plate-text">Active Goals</h3>
            <p class="plate2-num">0</p>
        </div>
        <div class="goals-complete">
            <h3 class="plate-text">Goals Completed</h3>
            <p class="plate3-num">0</p>
        </div>
    </section>
    <section class="chart">
        <h3 class="monthlyDep-text">Monthly deposits</h3>   
        <div class="chart-bars">
            <div class="bar-column">
                <div class="bar" style="height: 70px;"></div>
                <p class="bar-amount">500$</p>  
                <p class="bar-month">Jan</p>
            </div>
            <div class="bar-column">
                <div class="bar" style="height: 60px;"></div>
                <p class="bar-amount">500$</p>  
                <p class="bar-month">Feb</p>
            </div>
            <div class="bar-column">
                <div class="bar" style="height: 60px;"></div>
                <p class="bar-amount">500$</p>  
                <p class="bar-month">Mar</p>
            </div>
            <div class="bar-column">
                <div class="bar" style="height: 60px;"></div>
                <p class="bar-amount">500$</p>  
                <p class="bar-month">Apr</p>
            </div>
            <div class="bar-column">
                <div class="bar" style="height: 80px;"></div>
                <p class="bar-amount">500$</p>  
                <p class="bar-month">May</p>
            </div>
            <div class="bar-column">
                <div class="bar" style="height: 60px;"></div>
                <p class="bar-amount">500$</p>  
                <p class="bar-month">Jun</p>
            </div>
            <div class="bar-column">
                <div class="bar" style="height: 5px;"></div>
                <p class="bar-amount">500$</p>  
                <p class="bar-month">Jul</p>
            </div>
            <div class="bar-column">
                <div class="bar" style="height: 60px;"></div>
                <p class="bar-amount">500$</p>  
                <p class="bar-month">Aug</p>
            </div>
            <div class="bar-column">
                <div class="bar" style="height: 60px;"></div>
                <p class="bar-amount">500$</p>  
                <p class="bar-month">Sep</p>
            </div>
            <div class="bar-column">
                <div class="bar" style="height: 60px;"></div>
                <p class="bar-amount">500$</p>  
                <p class="bar-month">Oct</p>
            </div>
             <div class="bar-column">
                <div class="bar" style="height: 60px;"></div>
                <p class="bar-amount">500$</p>  
                <p class="bar-month">Nov</p>
            </div>
             <div class="bar-column">
                <div class="bar" style="height: 60px;"></div>
                <p class="bar-amount">500$</p>  
                <p class="bar-month">Dec</p>
            </div>
        </div>
    </section>  
    <section class="goals-section">
         <div class="filter-goals"> 
            <h2 class="goals-theme">Your goals</h2>
            <button class="filters">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2 4h12M5 8h6M7 12h2" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                </svg>Filters</button>
            <button class="sort-by">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5 3v10M5 3L2.5 5.5M5 3l2.5 2.5M11 13V3M11 13l2.5-2.5M11 13l-2.5-2.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>Sort by</button>
        </div>
       
    </section>
    

    
</body>
</html>
