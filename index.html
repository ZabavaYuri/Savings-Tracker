<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savings Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="site">
    <header class="top">
       <div class="logo-group">
            <img src="assets/logo.svg" alt="Savings Tracker logo">
            <h1 class="title">Savings Tracker</h1>
        </div>
        <button class="add-goal-btn"><span class="plus">+</span> New Goal</button>
    </header>

    <hr class="line">

    <section class="total-statistics">
        <div class="savings-plate">
            <p class="plate-text">Total Savings</p>
            <p class="plate1-num">$11 200</p>
        </div>
        <div class="active-goals">
            <p class="plate-text">Active Goals</p>
            <p class="plate2-num">0</p>
        </div>
        <div class="goals-complete">
            <p class="plate-text">Goals Completed</p>
            <p class="plate3-num">0</p>
        </div>
    </section>
    <section class="monthly-stat">
        <div class="monthly-deposit">
            <p class="mdeposit-text">Monthly Deposit</p>
        </div>
    </section>  
    

    
</body>
</html>
